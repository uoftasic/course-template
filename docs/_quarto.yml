# Quarto build of the COURSE-TEMPLATE docs (replacing Docsify's index.html,
# _sidebar.md and _navbar.md).
#
#   quarto preview docs          # live site at http://localhost:4200
#   quarto render docs           # site in docs/_site, with a PDF of every page
#   quarto render docs --profile pdf --to typst
#                                # the whole course as one PDF in docs/_book
#
# The sidebar follows the Course path order on the home page.

project:
  type: website
  output-dir: _site
  # quarto preview docs serves the site here (otherwise Quarto picks a random port).
  preview:
    port: 4200
    browser: false

website:
  title: "{{COURSE_TITLE}}"
  description: "{{DESCRIPTION}}"
  site-url: https://uoftasic.com/{{COURSE_ID}}/
  repo-url: https://github.com/uoftasic/{{COURSE_ID}}
  repo-subdir: docs
  repo-actions: [issue]
  search: true
  page-navigation: true
  navbar:
    left:
      - text: "Guide"
        href: guide/getting-started.md
      - text: "Labs"
        href: labs/lab-01-overview.md
    right:
      - text: Course PDF
        icon: file-pdf
        href: "{{COURSE_ID}}-course.pdf"
      - icon: github
        href: https://github.com/uoftasic/{{COURSE_ID}}
        aria-label: GitHub
  sidebar:
    style: docked
    contents:
      - text: "Home"
        href: index.md
      - section: "Course path"
        contents:
          - text: "1. Getting started"
            href: guide/getting-started.md
          - text: "2. Lab 01: Starter script"
            href: labs/lab-01-overview.md
      - section: "Repo"
        contents:
          - text: "Lab packages"
            href: https://github.com/uoftasic/{{COURSE_ID}}/tree/main/labs
          - text: "Scripts"
            href: https://github.com/uoftasic/{{COURSE_ID}}/tree/main/scripts

filters:
  - _filters/course.lua

# Collapsed answers move to the end of each page in PDFs; set this to
# "inline" to print them where they sit instead.
answers-in-pdf: end

format:
  html:
    theme:
      light: [cosmo, _light.scss]
      dark: [darkly, _dark.scss]
    css: _styles.css
    # Keeps old Docsify links (.../{{COURSE_ID}}/#/labs/...) working.
    include-in-header: _docsify-redirect.html
    toc: true
    toc-depth: 3
    code-copy: true
    lightbox: auto
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml-full.js"
    # Listing html first stops Quarto adding a second "Typst" link.
    format-links:
      - html
      - format: typst
        text: PDF
        icon: file-pdf
  typst:
    papersize: us-letter
    margin:
      x: 0.9in
      y: 0.9in
    fontsize: 10.5pt
    toc: false
